# Minimal nginx.conf for xray-northflank.
# Northflank terminates TLS at its edge load balancer and forwards plain HTTP
# to LISTEN_PORT, so this server block is HTTP-only on purpose.
# (If you switch to a Layer-4 TCP load balancer with your own cert, add
#  `listen 443 ssl;` here and set ssl_certificate/ssl_certificate_key.)

user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  4096;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # XHTTP emits a lot of requests; keep the access log but avoid buffering noise.
    access_log  /var/log/nginx/access.log;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    server_tokens   off;

    # Tunelling needs generous body handling and no proxy buffering.
    client_max_body_size 0;
    proxy_request_buffering off;
    proxy_buffering off;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1024;

    # Rendered from /etc/nginx/nf-templates/site.conf.tmpl by entrypoint.sh
    include /etc/nginx/conf.d/*.conf;

    # True only for a genuine WebSocket handshake. Used by the optional WS
    # location to decide between proxying to Xray and serving the decoy site.
    # This has to live in the http block: a `map` is not allowed inside server.
    map $http_upgrade $xnf_ws_upgrade {
        default   0;
        "~*(^|,)\s*websocket\s*(,|$)" 1;
    }
}
