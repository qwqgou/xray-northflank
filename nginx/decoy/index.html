<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Edge Gateway</title>
<style>
  :root { color-scheme: light dark; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
         font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
         background:#0f1115; color:#e6e8eb; }
  .card { max-width:640px; padding:48px 40px; text-align:center; }
  h1 { font-size:1.6rem; font-weight:600; margin:0 0 12px; letter-spacing:-.01em; }
  p { color:#9aa4b2; margin:0 0 8px; }
  code { background:#1b1f27; border:1px solid #262c36; border-radius:6px; padding:2px 6px; font-size:.9em; }
  .dot { display:inline-block; width:8px; height:8px; border-radius:50%; background:#3ddc84; margin-right:8px;
         box-shadow:0 0 0 4px rgba(61,220,132,.15); }
  footer { margin-top:28px; font-size:.8rem; color:#5d6673; }
</style>
</head>
<body>
  <main class="card">
    <h1><span class="dot"></span>Edge Gateway Online</h1>
    <p>This endpoint is healthy and serving traffic for <code>__SITE_HOST__</code>.</p>
    <p>Status: <code>200 OK</code></p>
    <footer>Powered by nginx</footer>
  </main>
</body>
</html>
