name: build

# The dev box that authored this project could not reach a container registry,
# so the Dockerfile was only statically reviewed there. This workflow is the
# real build check: it must succeed before deploying to Northflank.
on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  image:
    name: build image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: xray-northflank:ci

      # Runs the real entrypoint in self-check mode: it renders both templates,
      # asserts the vhost brace balance, and requires `nginx -t` plus
      # `xray run -test` to pass. This is how a missing runtime tool such as
      # envsubst, or a missing nginx user, gets caught here instead of as a
      # dead container on Northflank.
      - name: Self-check, WebSocket disabled
        run: |
          set -eux
          docker run --rm \
            -e UUID="$(cat /proc/sys/kernel/random/uuid)" \
            -e PUBLIC_HOST="example.code.run" \
            --entrypoint /entrypoint.sh \
            xray-northflank:ci --check > /tmp/render-no-ws.log 2>&1
          grep -q 'location ^~ /xhttp' /tmp/render-no-ws.log
          grep -q '"network": "xhttp"' /tmp/render-no-ws.log
          # the WS block must be gone and the markers must not survive
          ! grep -q '__ws__' /tmp/render-no-ws.log
          ! grep -q 'WG_WS_START' /tmp/render-no-ws.log
          ! grep -q 'WS_INBOUND_START' /tmp/render-no-ws.log

      - name: Self-check, WebSocket enabled
        run: |
          set -eux
          docker run --rm \
            -e UUID="$(cat /proc/sys/kernel/random/uuid)" \
            -e PUBLIC_HOST="example.code.run" \
            -e ENABLE_WS=true \
            -e SUB_ENABLE=true \
            -e SUB_TOKEN=ci-token \
            --entrypoint /entrypoint.sh \
            xray-northflank:ci --check > /tmp/render-ws.log 2>&1
          grep -q 'location ^~ /ws' /tmp/render-ws.log
          grep -q '"network": "ws"' /tmp/render-ws.log
          grep -q 'sub-[0-9a-f]\{16\}\.yaml' /tmp/render-ws.log

      # Starts the real image and exercises it from the outside. The container
      # step additionally runs a real Xray WebSocket client and a real Xray
      # XHTTP client through nginx, asserting HTTP 101 on the upgrade - the
      # check that the earlier probe-only suite lacked.
      - name: End-to-end test (decoy, WS + XHTTP tunnels, subscription)
        run: sh tests/ci-e2e-run.sh xray-northflank:ci

      - name: Dump container logs on failure
        if: failure()
        run: |
          docker ps -a
          docker logs xnf-ci-e2e 2>&1 || true
          docker inspect -f '{{.State.Status}} exit={{.State.ExitCode}} err={{.State.Error}}' xnf-ci-e2e || true
